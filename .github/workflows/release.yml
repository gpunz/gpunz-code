name: release

# Puts the builds of one «desktop» run into a draft GitHub release that already exists (the gpu.nz team creates the
# tag and the draft: a workflow's own token may not tag a commit). Run by hand, after the same files were checked
# and their update manifests signed on the release machine; the signed manifests are added from there, and a person
# publishes the release.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The «desktop» run whose builds are released
        required: true
      tag:
        description: The tag of the draft release (code-v0.2.0)
        required: true

permissions:
  contents: write
  actions: read

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Add the files to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          cd artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt smoke-*.png latest*.yml
          ls -la
          gh release upload "$TAG" gpunz-code-* SHA256SUMS.txt --clobber
