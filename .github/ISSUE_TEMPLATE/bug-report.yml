name: Bug report
description: Something in gpu.nz Code does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The quickest way to report a problem is inside the app: **Help → Help and feedback** — it can attach the app's log.
        Please do not paste your account key or anything private here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Help → Help and feedback.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model you launched, if it matters.
      placeholder: Qwen 3.8 27B
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Help → «Save the logs to a file» makes an archive; attach what is relevant.
      render: text
